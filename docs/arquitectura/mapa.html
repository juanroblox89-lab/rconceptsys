<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>rconceptsys — Mapa de Arquitectura</title>
<style>
:root{
  --bg:#0b0d10; --bg-elev:#111418; --bg-hover:#1a1e24;
  --fg:#e8e9eb; --fg-muted:#8b8d93; --fg-subtle:#5a5c63;
  --acc:#22d3ee; --acc-dim:#06b6d4; --acc-bg:#0e2a30;
  --ok:#22c55e; --ok-bg:#0e2a1a; --warn:#fbbf24; --warn-bg:#2a240e;
  --err:#ef4444; --err-bg:#2a0e0e;
  --card:#151920; --border:#2a2e36; --border-strong:#3a3f4a;
  --radius:6px; --radius-sm:4px;
  --space:8px; --space-lg:16px; --space-xl:24px;
  --font-sans:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
  --mono:ui-monospace,SFMono-Regular,"SF Mono",Menlo,Consolas,monospace;
  --shadow:0 4px 16px rgba(0,0,0,.4),0 0 0 1px rgba(255,255,255,.03);
  --trans-fast:120ms; --trans-med:200ms; --trans-slow:320ms;
}
@media (prefers-reduced-motion:reduce){
  :root{--trans-fast:0ms;--trans-med:0ms;--trans-slow:0ms;}
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{
  font-family:var(--font-sans); font-size:13px; line-height:1.5;
  background:var(--bg); color:var(--fg); min-width:320px;
  -webkit-font-smoothing:antialiased; -moz-osx-font-smoothing:grayscale;
}
a{color:var(--acc);text-decoration:none}a:hover{text-decoration:underline}
code{font-family:var(--mono);font-size:.9em;background:var(--bg-hover);padding:.1em .3em;border-radius:3px}
.sr-only{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0}

#app{display:flex;flex-direction:column;height:100vh;overflow:hidden}

/* Header */
header{
  display:flex;align-items:center;justify-content:space-between;
  padding:var(--space) var(--space-lg); background:var(--bg-elev);
  border-bottom:1px solid var(--border); flex-shrink:0; gap:var(--space);
}
header h1{font-size:14px;font-weight:600;letter-spacing:.3px;white-space:nowrap}
header .meta{font-size:11px;color:var(--fg-subtle);white-space:nowrap}
header .actions{display:flex;gap:var(--space);align-items:center}
.btn{
  display:inline-flex;align-items:center;gap:6px;padding:6px 10px;
  font-size:11px;font-weight:500;border-radius:var(--radius-sm);
  border:1px solid var(--border);background:var(--bg-hover);color:var(--fg);
  cursor:pointer;transition:background var(--trans-fast),border-color var(--trans-fast),color var(--trans-fast);
}
.btn:hover{background:var(--bg-elev);border-color:var(--border-strong)}
.btn:active{transform:scale(.98)}
.btn.primary{background:var(--acc);border-color:var(--acc);color:#001a1f}
.btn.primary:hover{background:var(--acc-dim)}
.btn.ghost{background:transparent}
.icon-btn{padding:6px;display:flex;align-items:center;justify-content:center}

/* Layout principal */
.main{display:flex;flex:1;overflow:hidden;min-height:0}

/* Sidebar flujos */
.sidebar{
  width:260px; max-width:90vw; flex-shrink:0;
  background:var(--bg-elev); border-right:1px solid var(--border);
  display:flex;flex-direction:column;overflow:hidden;
}
.sidebar-header{
  padding:var(--space) var(--space-lg); border-bottom:1px solid var(--border);
  display:flex;align-items:center;justify-content:space-between;
}
.sidebar-header h2{font-size:12px;font-weight:600;text-transform:uppercase;letter-spacing:.5px;color:var(--fg-muted)}
.sidebar-header .count{font-size:11px;color:var(--fg-subtle);background:var(--bg-hover);padding:2px 6px;border-radius:999px}
.flow-list{flex:1;overflow:auto;padding:var(--space);display:flex;flex-direction:column;gap:4px}
.flow-item{
  display:flex;align-items:center;gap:8px;padding:8px 10px;
  border-radius:var(--radius); cursor:pointer;
  background:transparent; border:1px solid transparent;
  transition:background var(--trans-fast),border-color var(--trans-fast);
}
.flow-item:hover{background:var(--bg-hover);border-color:var(--border)}
.flow-item.active{background:var(--acc-bg);border-color:var(--acc)}
.flow-item .icon{flex-shrink:0;width:28px;height:28px;display:flex;align-items:center;justify-content:center;border-radius:4px;background:var(--bg-hover);color:var(--fg-muted)}
.flow-item.active .icon{background:var(--acc);color:#001a1f}
.flow-item .info{flex:1;min-width:0;display:flex;flex-direction:column}
.flow-item .name{font-size:12px;font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.flow-item .desc{font-size:10px;color:var(--fg-subtle);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.flow-item .steps{font-size:10px;color:var(--fg-subtle);margin-top:2px}

/* Canvas */
.canvas-wrap{flex:1;overflow:auto;position:relative;background:var(--bg)}
.canvas{position:relative;min-height:100%;min-width:100%}
.connections-layer{position:absolute;top:0;left:0;width:100%;height:100%;pointer-events:none;z-index:1;overflow:visible}
.connections-layer path.connection{fill:none;stroke:var(--acc);stroke-width:2;opacity:.85}
.connections-layer circle.connection-marker{fill:var(--acc)}
.module{
  position:absolute; background:var(--card); border:1px solid var(--border);
  border-radius:var(--radius); padding:var(--space-lg); min-width:220px; max-width:280px;
  box-shadow:var(--shadow);
  transition:transform var(--trans-med),box-shadow var(--trans-med),border-color var(--trans-med);
}
.module:hover{z-index:10;box-shadow:0 8px 24px rgba(0,0,0,.5),0 0 0 1px var(--acc)}
.module.selected{border-color:var(--acc);box-shadow:0 0 0 2px var(--acc-bg),var(--shadow)}
.module-header{display:flex;align-items:center;gap:8px;margin-bottom:var(--space);padding-bottom:var(--space);border-bottom:1px solid var(--border)}
.module-header .icon{width:28px;height:28px;display:flex;align-items:center;justify-content:center;border-radius:4px;background:var(--bg-hover);color:var(--acc)}
.module-header h3{font-size:13px;font-weight:600}
.module-header .type{font-size:10px;color:var(--fg-subtle);text-transform:uppercase;letter-spacing:.5px;margin-left:auto;background:var(--bg-hover);padding:2px 6px;border-radius:999px}
.module-files{display:flex;flex-direction:column;gap:4px}
.module-file{font-size:11px;color:var(--fg-muted);display:flex;align-items:center;gap:6px;padding:4px 6px;border-radius:var(--radius-sm);transition:background var(--trans-fast)}
.module-file:hover{background:var(--bg-hover);color:var(--fg)}
.module-file code{font-size:10px}

/* Conexiones (líneas SVG) */
.connection{position:absolute;pointer-events:none;z-index:1}
.connection path{fill:none;stroke:var(--border);stroke-width:1.5;stroke-dasharray:4 4;transition:stroke var(--trans-med),stroke-width var(--trans-med)}
.connection.active path{stroke:var(--acc);stroke-width:2;stroke-dasharray:none}
.connection-marker{position:absolute;width:8px;height:8px;border-radius:50%;background:var(--acc);transform:translate(-50%,-50%);opacity:0;transition:opacity var(--trans-fast)}
.connection.active .connection-marker{opacity:1;animation:pulse 1.5s ease-in-out infinite}
@keyframes pulse{0%,100%{transform:translate(-50%,-50%) scale(1);opacity:.6}50%{transform:translate(-50%,-50%) scale(1.4);opacity:1}}

/* Panel detalle flujo */
.detail{
  width:360px; max-width:90vw; flex-shrink:0;
  background:var(--bg-elev); border-left:1px solid var(--border);
  display:flex;flex-direction:column;overflow:hidden;
}
.detail-header{
  padding:var(--space) var(--space-lg); border-bottom:1px solid var(--border);
  display:flex;align-items:center;justify-content:space-between;gap:var(--space);
}
.detail-header h2{font-size:13px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.detail-header .badge{font-size:10px;padding:2px 6px;border-radius:999px;background:var(--bg-hover);color:var(--fg-muted)}
.detail-content{flex:1;overflow:auto;padding:var(--space-lg);display:flex;flex-direction:column;gap:var(--space)}
.detail-empty{display:flex;flex-direction:column;align-items:center;justify-content:center;height:100%;color:var(--fg-subtle);text-align:center;gap:8px}
.detail-empty svg{width:48px;height:48px;opacity:.4}
.step-list{display:flex;flex-direction:column;gap:8px}
.step-item{
  display:flex;gap:10px;padding:10px;background:var(--card);border:1px solid var(--border);border-radius:var(--radius);
  transition:background var(--trans-fast),border-color var(--trans-fast),transform var(--trans-fast);
}
.step-item:hover{border-color:var(--border-strong);transform:translateX(2px)}
.step-item.active{background:var(--acc-bg);border-color:var(--acc)}
.step-num{flex-shrink:0;width:24px;height:24px;display:flex;align-items:center;justify-content:center;background:var(--bg-hover);border-radius:50%;font-size:11px;font-weight:600;color:var(--fg-muted);border:1px solid var(--border)}
.step-item.active .step-num{background:var(--acc);color:#001a1f;border-color:var(--acc)}
.step-info{flex:1;min-width:0}
.step-info .func{font-size:11px;font-family:var(--mono);color:var(--acc);margin-bottom:2px;display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.step-info .func .file{color:var(--fg-muted);font-size:10px}
.step-info .desc{font-size:11px;color:var(--fg);line-height:1.4}
.step-info .refs{margin-top:6px;display:flex;flex-wrap:wrap;gap:4px}
.ref-tag{font-size:9px;padding:2px 6px;border-radius:3px;background:var(--bg-hover);color:var(--fg-subtle);border:1px solid var(--border)}
.ref-tag.sql{background:var(--ok-bg);color:var(--ok);border-color:var(--ok)}
.ref-tag.md{background:var(--warn-bg);color:var(--warn);border-color:var(--warn)}

/* Modal módulo */
.modal-overlay{
  position:fixed;inset:0;background:rgba(0,0,0,.7);z-index:100;
  display:flex;align-items:center;justify-content:center;padding:var(--space-lg);
  opacity:0;visibility:hidden;transition:opacity var(--trans-med),visibility var(--trans-med);
}
.modal-overlay.open{opacity:1;visibility:visible}
.modal{
  background:var(--card);border:1px solid var(--border);border-radius:var(--radius);
  width:100%;max-width:480px;max-height:85vh;overflow:auto;
  transform:scale(.95);transition:transform var(--trans-med);
  box-shadow:0 12px 40px rgba(0,0,0,.6),0 0 0 1px rgba(255,255,255,.05);
}
.modal-overlay.open .modal{transform:scale(1)}
.modal-header{display:flex;align-items:center;justify-content:space-between;padding:var(--space-lg);border-bottom:1px solid var(--border)}
.modal-header h3{font-size:14px;font-weight:600}
.modal-close{background:none;border:none;color:var(--fg-muted);cursor:pointer;padding:4px;display:flex;align-items:center;justify-content:center;border-radius:var(--radius-sm);transition:background var(--trans-fast),color var(--trans-fast)}
.modal-close:hover{background:var(--bg-hover);color:var(--fg)}
.modal-body{padding:var(--space-lg);display:flex;flex-direction:column;gap:var(--space-lg)}
.modal-section h4{font-size:11px;font-weight:600;text-transform:uppercase;letter-spacing:.5px;color:var(--fg-muted);margin-bottom:var(--space)}
.modal-files{display:flex;flex-direction:column;gap:4px}
.modal-file{font-size:12px;color:var(--fg-muted);display:flex;align-items:center;gap:8px;padding:6px 8px;border-radius:var(--radius-sm);background:var(--bg-hover);transition:background var(--trans-fast),color var(--trans-fast)}
.modal-file:hover{background:var(--bg-elev);color:var(--fg)}
.modal-file code{font-size:10px}
.modal-endpoints{display:flex;flex-direction:column;gap:4px}
.modal-endpoint{font-size:11px;display:flex;align-items:center;gap:8px;padding:6px 8px;border-radius:var(--radius-sm);background:var(--bg-hover)}
.modal-endpoint .method{font-size:10px;font-weight:600;padding:2px 6px;border-radius:3px;background:var(--bg);color:var(--fg-muted)}
.modal-endpoint .method.get{background:#0e2a1a;color:#22c55e}
.modal-endpoint .method.post{background:#0e1a2a;color:#22d3ee}
.modal-endpoint .method.patch{background:#2a1a0e;color:#fbbf24}
.modal-endpoint .method.delete{background:#2a0e0e;color:#ef4444}
.modal-endpoint .path{font-family:var(--mono);font-size:10px;color:var(--fg);flex:1}
.modal-tables{display:flex;flex-wrap:wrap;gap:4px}
.modal-table{font-size:11px;padding:4px 8px;border-radius:var(--radius-sm);background:var(--bg-hover);color:var(--fg-muted);border:1px solid var(--border);transition:all var(--trans-fast)}
.modal-table:hover{background:var(--bg-elev);color:var(--fg);border-color:var(--border-strong)}

/* Footer */
footer{
  padding:var(--space) var(--space-lg); background:var(--bg-elev);
  border-top:1px solid var(--border); flex-shrink:0;
  display:flex;align-items:center;justify-content:space-between;gap:var(--space);
  font-size:11px;color:var(--fg-subtle);flex-wrap:wrap;
}
footer .legend{display:flex;align-items:center;gap:var(--space-lg);flex-wrap:wrap}
footer .legend-item{display:flex;align-items:center;gap:6px;font-size:10px}
footer .legend-color{width:10px;height:10px;border-radius:2px}

/* Responsive */
@media (max-width:900px){
  .detail{display:none}
  .sidebar{width:220px}
}
@media (max-width:640px){
  header{padding:var(--space)}
  .sidebar{position:fixed;left:0;top:0;bottom:0;z-index:50;width:280px;transform:translateX(-100%);transition:transform var(--trans-med)}
  .sidebar.open{transform:translateX(0)}
  .main{position:relative}
  .menu-btn{display:flex}
  .sidebar-overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:49}
  .sidebar-overlay.open{display:block}
  .canvas-wrap{height:calc(100vh - 88px)}
}
.menu-btn{display:none}
@media (max-width:640px){
  .menu-btn{display:flex}
}

/* Scrollbar */
::-webkit-scrollbar{width:8px;height:8px}
::-webkit-scrollbar-track{background:transparent}
::-webkit-scrollbar-thumb{background:var(--border-strong);border-radius:4px;border:2px solid var(--bg)}
::-webkit-scrollbar-thumb:hover{background:var(--fg-subtle)}
::-webkit-scrollbar-corner{background:transparent}
</style>
</head>

<div id="app">
  <header>
    <div style="display:flex;align-items:center;gap:10px">
      <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" style="color:var(--acc)">
        <path d="M21 16V8a2 2 0 0 0-1-1.73l-7-4a2 2 0 0 0-2 0l-7 4A2 2 0 0 0 3 8v8a2 2 0 0 0 1 1.73l7 4a2 2 0 0 0 2 0l7-4A2 2 0 0 0 21 16z"/>
        <polyline points="3.27 6.96 12 12.01 20.73 6.96"/>

      <h1>rconceptsys</h1>

    <div class="actions">

        Regenerar

  <div class="main">
    <div class="sidebar-overlay" id="sidebarOverlay"></div>
    <aside class="sidebar" id="sidebar" role="navigation" aria-label="Flujos de arquitectura">

        <h2>Flujos</h2>

      <div class="detail-content" id="detailContent">
        <div class="detail-empty">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><circle cx="12" cy="12" r="10"/><path d="M12 6v6l4 2"/></svg>
          <p>Haz clic en un flujo para ver sus pasos</p>
        </div>
      </div>
    </aside>
  </div>

  <footer>
    <div class="legend">
      <span class="legend-item"><span class="legend-color" style="background:#151920;border:1px solid var(--border)"></span>Módulo</span>
      <span class="legend-item"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="var(--border)" stroke-width="1.5" style="stroke-dasharray:4 4"><path d="M3 12h18"/></svg> Conexión</span>
      <span class="legend-item"><span class="legend-color" style="background:var(--acc)"></span> Activo</span>
    </div>
    <div id="commitHash"></div>
  </footer>
</div>

<!-- Modal módulo -->
<div class="modal-overlay" id="modalOverlay" role="dialog" aria-modal="true" aria-labelledby="modalTitle">
  <div class="modal">
    <div class="modal-header">
      <h3 id="modalTitle"></h3>
      <button class="modal-close" id="modalClose" aria-label="Cerrar"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg></button>
    </div>
    <div class="modal-body" id="modalBody"></div>
  </div>
</div>

  'login-celular': `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="5" y="2" width="14" height="20" rx="2"/><path d="M12 18h.01"/></svg>`
};

// ==== INICIALIZACIÓN ====
document.addEventListener('DOMContentLoaded', init);

function init(){
  renderModules();
  renderFlowList();
  renderConnections();
  updateGenTime();
  loadCommitHash();
  setupEventListeners();
  // Auto-seleccionar primer flujo
  if(FLUJOS_DATA.flujos.length > 0){
    selectFlow(FLUJOS_DATA.flujos[0].id);
  }
}

function updateGenTime(){
  const el = document.getElementById('genTime');
  if(el && MAPA_DATA.generado_en){
    const d = new Date(MAPA_DATA.generado_en);
    el.textContent = `Generado: ${d.toLocaleString('es-ES',{dateStyle:'short',timeStyle:'short'})}`;
  }
}

async function loadCommitHash(){
  try{
    const res = await fetch('mapa.json');
    if(res.ok){
      const data = await res.json();
      const el = document.getElementById('commitHash');
      if(el && data.commit_hash){
        el.textContent = `commit: ${data.commit_hash.slice(0,8)}`;
      }
    }
  }catch(e){}
}

function setupEventListeners(){
  document.getElementById('menuBtn')?.addEventListener('click',()=>{
    document.getElementById('sidebar').classList.toggle('open');
    document.getElementById('sidebarOverlay').classList.toggle('open');
  });
  document.getElementById('sidebarOverlay')?.addEventListener('click',()=>{
    document.getElementById('sidebar').classList.remove('open');
    document.getElementById('sidebarOverlay').classList.remove('open');
  });
  document.getElementById('modalClose')?.addEventListener('click',closeModal);
  document.getElementById('modalOverlay')?.addEventListener('click',(e)=>{
    if(e.target === e.currentTarget) closeModal();
  });
  document.addEventListener('keydown',(e)=>{
    if(e.key==='Escape') closeModal();
  });
  window.addEventListener('resize',()=>{
    if(window.innerWidth>640){
      document.getElementById('sidebar').classList.remove('open');
      document.getElementById('sidebarOverlay').classList.remove('open');
    }
    renderConnections();
  });
}

async function regenerateMap(){
  const btn = document.getElementById('btnRegenerate');
  btn.disabled = true;
  btn.innerHTML = `<svg class="spin" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10" stroke-opacity=".25"/><path d="M12 2a10 10 0 0 1 10 10" stroke-opacity="1"/></svg> Generando...`;
  try{
    const res = await fetch('/api/generar-mapa',{method:'POST'});
    if(res.ok){
      location.reload();
    }else{
      alert('Error regenerando mapa');
      btn.disabled = false;
      btn.innerHTML = `<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="23 4 23 10 17 10"/><path d="M20.49 15a9 9 0 1 1-2.12-9.36L23 10"/></svg> Regenerar`;
    }
  }catch(e){
    alert('Error: '+e.message);
    btn.disabled = false;
    btn.innerHTML = `<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="23 4 23 10 17 10"/><path d="M20.49 15a9 9 0 1 1-2.12-9.36L23 10"/></svg> Regenerar`;
  }
}

// ==== RENDER MÓDULOS ====
function renderModules(){
  const canvas = document.getElementById('canvas');
  const modules = MAPA_DATA.modulos || [];
  const wrapRect = document.getElementById('canvasWrap').getBoundingClientRect();
  
  // Layout automático: grid responsivo
  const cols = Math.max(1, Math.floor(wrapRect.width / 320));
  const gap = 24;
  const cardWidth = 260;
  
  modules.forEach((mod, i) => {
    const col = i % cols;
    const row = Math.floor(i / cols);
    const x = 24 + col * (cardWidth + gap);
    const y = 24 + row * (200 + gap);
    
    modulePositions[mod.id] = {x, y, w: cardWidth, h: 200};
    
    const div = document.createElement('div');
    div.className = 'module';
    div.id = `mod-${mod.id}`;
    div.dataset.moduleId = mod.id;
    div.style.left = x + 'px';
    div.style.top = y + 'px';
    div.innerHTML = `
      <div class="module-header">
        <div class="icon">${ICONS[mod.tipo] || ICONS.default}</div>
        <h3>${escapeHtml(mod.nombre)}</h3>
        <span class="type">${escapeHtml(mod.tipo)}</span>
      </div>
      <div class="module-files">
        ${(mod.archivos_clave || []).slice(0,8).map(f => `
          <div class="module-file" title="${escapeHtml(f)}">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" style="color:var(--fg-subtle);flex-shrink:0"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/></svg>
            <code>${escapeHtml(f)}</code>
          </div>
        `).join('')}
        ${mod.archivos_clave && mod.archivos_clave.length > 8 ? `<div class="module-file" style="color:var(--acc);font-size:10px">+${mod.archivos_clave.length - 8} más</div>` : ''}
      </div>
    `;
    div.addEventListener('click',(e)=>{
      e.stopPropagation();
      openModuleModal(mod);
    });
    canvas.appendChild(div);
  });
  
  // Reacomodar con la altura real de cada tarjeta (columnas tipo mosaico)
  const colY = new Array(cols).fill(24);
  modules.forEach((mod, i) => {
    const div = document.getElementById(`mod-${mod.id}`);
    const col = colY.indexOf(Math.min(...colY));
    const x = 24 + col * (cardWidth + gap);
    const y = colY[col];
    const h = div.offsetHeight;
    div.style.left = x + 'px';
    div.style.top = y + 'px';
    modulePositions[mod.id] = {x, y, w: div.offsetWidth, h};
    colY[col] = y + h + gap;
  });
  canvas.style.minHeight = (Math.max(...colY) + 24) + 'px';
}

function openModuleModal(mod){
  const title = document.getElementById('modalTitle');
  const body = document.getElementById('modalBody');
  title.textContent = mod.nombre;
  
  let html = '';
  if(mod.archivos_clave && mod.archivos_clave.length){
    html += `<div class="modal-section"><h4>Archivos clave (${mod.archivos_clave.length})</h4><div class="modal-files">${mod.archivos_clave.map(f=>`<div class="modal-file"><code>${escapeHtml(f)}</code></div>`).join('')}</div></div>`;
  }
  if(mod.endpoints && mod.endpoints.length){
    html += `<div class="modal-section"><h4>Endpoints (${mod.endpoints.length})</h4><div class="modal-endpoints">${mod.endpoints.map(e=>`<div class="modal-endpoint"><span class="method ${e.method.toLowerCase()}">${e.method}</span><span class="path">${escapeHtml(e.path)}</span></div>`).join('')}</div></div>`;
  }
  if(mod.tablas && mod.tablas.length){
    html += `<div class="modal-section"><h4>Tablas (${mod.tablas.length})</h4><div class="modal-tables">${mod.tablas.map(t=>`<span class="modal-table">${escapeHtml(t)}</span>`).join('')}</div></div>`;
  }
  if(mod.env_vars && mod.env_vars.length){
    html += `<div class="modal-section"><h4>Variables de entorno (${mod.env_vars.length})</h4><div class="modal-tables">${mod.env_vars.map(v=>`<span class="modal-table">${escapeHtml(v)}</span>`).join('')}</div></div>`;
  }
  
  body.innerHTML = html || '<p style="color:var(--fg-muted)">Sin detalles adicionales</p>';
  document.getElementById('modalOverlay').classList.add('open');
  document.body.style.overflow = 'hidden';
}

function closeModal(){
  document.getElementById('modalOverlay').classList.remove('open');
  document.body.style.overflow = '';
}

// ==== RENDER LISTA DE FLUJOS ====
function renderFlowList(){
  const list = document.getElementById('flowList');
  const flows = FLUJOS_DATA.flujos || [];
  document.getElementById('flowCount').textContent = flows.length;
  
  list.innerHTML = flows.map(flow => `
    <div class="flow-item" id="flow-${flow.id}" data-flow-id="${flow.id}" role="option" tabindex="0" aria-selected="false">
      <div class="icon">${FLOW_ICONS[flow.id] || FLOW_ICONS['asignar-trabajo']}</div>
      <div class="info">
        <span class="name">${escapeHtml(flow.nombre)}</span>
        <span class="desc">${escapeHtml(flow.descripcion)}</span>
        <span class="steps">${flow.pasos?.length || 0} pasos</span>
      </div>
    </div>
  `).join('');
  
  list.querySelectorAll('.flow-item').forEach(item => {
    item.addEventListener('click',()=>selectFlow(item.dataset.flowId));
    item.addEventListener('keydown',(e)=>{if(e.key==='Enter'||e.key===' ')selectFlow(item.dataset.flowId)});
  });
}

// ==== SELECCIÓN DE FLUJO ====
function selectFlow(flowId){
  selectedFlowId = flowId;
  
  // Actualizar UI lista
  document.querySelectorAll('.flow-item').forEach(item=>{
    const active = item.dataset.flowId === flowId;
    item.classList.toggle('active', active);
    item.setAttribute('aria-selected', active);
  });
  
  // Actualizar módulos
  const flow = FLUJOS_DATA.flujos.find(f=>f.id===flowId);
  if(!flow) return;
  
  document.getElementById('detailTitle').textContent = flow.nombre;
  document.getElementById('detailSteps').textContent = `${flow.pasos?.length || 0} pasos`;
  
  // Resaltar módulos involucrados
  const involvedModules = new Set();
  flow.pasos?.forEach(paso=>{
    if(paso.archivo_funcion){
      const file = paso.archivo_funcion.split(':')[0];
      MAPA_DATA.modulos.forEach(mod=>{
        if(mod.archivos_clave?.includes(file)){
          involvedModules.add(mod.id);
        }
      });
    }
  });
  
  document.querySelectorAll('.module').forEach(mod=>{
    const active = involvedModules.has(mod.dataset.moduleId);
    mod.classList.toggle('selected', active);
  });
  
  // Render pasos en detail
  renderFlowSteps(flow);
  
  // Render conexiones
  renderConnections();
  
  // Cerrar sidebar en móvil
  if(window.innerWidth <= 640){
    document.getElementById('sidebar').classList.remove('open');
    document.getElementById('sidebarOverlay').classList.remove('open');
  }
}

function renderFlowSteps(flow){
  const content = document.getElementById('detailContent');
  const steps = flow.pasos || [];
  
  if(steps.length === 0){
    content.innerHTML = `<div class="detail-empty"><p>Sin pasos definidos</p></div>`;
    return;
  }
  
  content.innerHTML = `
    <div class="step-list">
      ${steps.map((paso, i) => `
        <div class="step-item" id="step-${flow.id}-${i}" data-step-index="${i}">
          <div class="step-num">${i+1}</div>
          <div class="step-info">
            ${paso.archivo_funcion ? `
              <div class="func">
                <span class="file">${escapeHtml(paso.archivo_funcion.split(':')[0])}:</span>
                <span>${escapeHtml(paso.archivo_funcion.split(':')[1] || '')}</span>
              </div>
            ` : ''}
            <div class="desc">${escapeHtml(paso.descripcion)}</div>
            ${paso.archivo_funcion_extra ? `
              <div class="refs">
                ${paso.archivo_funcion_extra.map(ref => {
                  const ext = ref.split('.').pop()?.toLowerCase();
                  const cls = ['sql','md'].includes(ext) ? ext : '';
                  return `<span class="ref-tag ${cls}">${escapeHtml(ref)}</span>`;
                }).join('')}
              </div>
            ` : ''}
          </div>
        </div>
      `).join('')}
    </div>
  `;
  
  // Click en paso -> resaltar en canvas
  content.querySelectorAll('.step-item').forEach(item=>{
    item.addEventListener('click',()=>{
      content.querySelectorAll('.step-item').forEach(s=>s.classList.remove('active'));
      item.classList.add('active');
      highlightStepInModules(flow, parseInt(item.dataset.stepIndex));
    });
  });
}

function highlightStepInModules(flow, stepIndex){
  const paso = flow.pasos[stepIndex];
  if(!paso?.archivo_funcion) return;
  
  const file = paso.archivo_funcion.split(':')[0];
  document.querySelectorAll('.module').forEach(mod=>{
    const isInvolved = MAPA_DATA.modulos.find(m=>m.id===mod.dataset.moduleId)?.archivos_clave?.includes(file);
    mod.classList.toggle('selected', isInvolved);
  });
  renderConnections();
}

// ==== CONEXIONES SVG ====
function renderConnections(){
  if(!selectedFlowId) {
    document.getElementById('connectionsLayer').innerHTML = '';
    return;
  }
  
  const flow = FLUJOS_DATA.flujos.find(f=>f.id===selectedFlowId);
  if(!flow) return;
  
  const svg = document.getElementById('connectionsLayer');
  const canvasWrap = document.getElementById('canvasWrap');
  const wrapRect = canvasWrap.getBoundingClientRect();
  
  // Módulos involucrados en orden
  const moduleOrder = [];
  const seen = new Set();
  flow.pasos.forEach(paso=>{
    if(paso.archivo_funcion){
      const file = paso.archivo_funcion.split(':')[0];
      MAPA_DATA.modulos.forEach(mod=>{
        if(mod.archivos_clave?.includes(file) && !seen.has(mod.id)){
          seen.add(mod.id);
          moduleOrder.push(mod.id);
        }
      });
    }
  });
  
  // Dibujar líneas entre módulos consecutivos
  let paths = '';
  for(let i=0;i<moduleOrder.length-1;i++){
    const from = modulePositions[moduleOrder[i]];
    const to = modulePositions[moduleOrder[i+1]];
    if(!from || !to) continue;
    
    const fromX = from.x + from.w;
    const fromY = from.y + from.h/2;
    const toX = to.x;
    const toY = to.y + to.h/2;
    
    const midX = (fromX + toX) / 2;
    // Curva Bezier suave
    paths += `<path class="connection" d="M${fromX} ${fromY} C${midX} ${fromY}, ${midX} ${toY}, ${toX} ${toY}"/>`;
    // Marcador animado
    paths += `<circle class="connection-marker" cx="${midX}" cy="${(fromY+toY)/2}" r="4"/>`;
  }
  
  svg.innerHTML = paths;
  svg.style.width = canvasWrap.scrollWidth + 'px';
  svg.style.height = canvasWrap.scrollHeight + 'px';
}

// ==== UTILIDADES ====
function escapeHtml(str){
  if(!str) return '';
  return String(str).replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}

// Exponer para consola
window.selectFlow = selectFlow;
window.regenerateMap = regenerateMap;
</script>
